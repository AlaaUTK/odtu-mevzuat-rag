services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: staj_surrealdb
    user: root
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: start --user root --pass root --bind 0.0.0.0:8000 surrealkv://data/database
    volumes:
      - surreal_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: staj_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_PASSWORD=clickhouse123
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  surreal_data:
  clickhouse_data: